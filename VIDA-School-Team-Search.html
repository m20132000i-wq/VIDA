async function vidaAskAI(q,context){
 q=String(q||'').trim();if(!q)throw new Error('لطفاً سؤال را وارد کنید.');if(q.length>5000)throw new Error('سؤال بیش از حد طولانی است.');
 var cfg=G('aiSettings',{on:'فعال'});if(String(cfg.on||'فعال').toLowerCase()==='خاموش')throw new Error('دستیار هوشمند موقتاً غیرفعال است.');
 if(!_sbClient&&!await connectBackend())throw new Error('دستیار هوشمند فعلاً در دسترس نیست.');
 var backend=(window.VIDA_APP_CONFIG&&window.VIDA_APP_CONFIG.backend)||{},fn=String(backend.aiFunction||'vida-ai');
 var r=await _sbClient.functions.invoke(fn,{body:{question:q,context:context||'',language:'fa',app:'VIDA'}});
 if(r.error){console.warn('AI request failed',r.error);throw new Error('پاسخ‌گویی دستیار در حال حاضر ممکن نیست. کمی بعد دوباره تلاش کنید.');}
 var d=r.data||{},answer=typeof d==='string'?d:(d.answer||d.response||d.text||'');
 if(!String(answer).trim())throw new Error((d&&d.error)||'پاسخ معتبری دریافت نشد.');return String(answer).trim();
}

function startVoice(inputId,statusId){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;var status=E(statusId);if(!SR){if(status)status.textContent='مرورگر این دستگاه از تشخیص گفتار پشتیبانی نمی‌کند؛ از مرورگر پشتیبانی‌شده استفاده کن یا سؤال را تایپ کن.';return}try{var rec=new SR();rec.lang='fa-IR';rec.interimResults=false;rec.maxAlternatives=1;if(status)status.textContent='در حال شنیدن… اجازهٔ میکروفن را بده و صحبت کن.';rec.onresult=function(ev){var input=E(inputId);if(input)input.value=ev.results[0][0].transcript;if(status)status.textContent='گفتار به متن تبدیل شد. برای دریافت پاسخ، ارسال پرسش را بزن.'};rec.onerror=function(ev){if(status)status.textContent=ev.error==='not-allowed'?'اجازهٔ میکروفن داده نشد. از تنظیمات مرورگر اجازه بده.':'تشخیص صدا ناموفق بود؛ دوباره تلاش کن یا سؤال را تایپ کن.'};rec.onend=function(){if(status&&status.textContent==='در حال شنیدن… اجازهٔ میکروفن را بده و صحبت کن.')status.textContent='شنیدن پایان یافت. اگر متن ثبت نشد، دوباره تلاش کن.'};rec.start()}catch(err){if(status)status.textContent='میکروفن شروع نشد؛ صفحه را در مرورگر باز کن و اجازهٔ میکروفن بده.'}}

function childSelGo(){if(!CU||CU.role!=='parent'){alert('دسترسی نامعتبر است.');return}var child=fa2en(E('chN').value.trim());if(!/^\d{10}$/.test(child)||String(CU.child||'')!==String(child)){alert('این دانش‌آموز به حساب والدین شما پیوند داده نشده است. برای پیوند، با مدیر مدرسه تماس بگیرید.');return}var student=schoolUser(child);if(!student||student.role!=='student'||String(student.sId||'')!==String(CU.sId||'')){alert('پیوند دانش‌آموز معتبر نیست.');return}home()}
function childStatus(){progressPage()}
function childReport(){var en=effNat(),R=G('res',[]).filter(function(r){return r.nat==en}),h='<div class="card"><h3>گزارش عملکرد فرزند ('+nameOf(en)+')</h3>';for(var i=0;i<R.length;i++)h+='<div>'+(R[i].exam||'')+': '+R[i].m+'</div>';h+='<button class="btn2" onclick="home()">بازگشت</button></div>';E('app').innerHTML=h}
/* سیستم */
function sysReports(){var U=G('users',[]),Sc=G('schools',[]),Ee=G('exams',[]);if(CU&&CU.role!=='builder'){U=U.filter(function(u){return String(u.sId||'')===String(CU.sId||'')});Sc=Sc.filter(function(x){return String(x.id)===String(CU.sId||'')});Ee=Ee.filter(inCurrentSchool)}var L=G('log',[]);if(CU&&CU.role!=='builder')L=L.filter(function(l){return U.some(function(u){return l.t.indexOf(u.nat)>-1})});var h='<div class="card"><h3>گزارش سیستم</h3><p>کاربران: '+U.length+' | مدارس: '+Sc.length+' | آزمون‌ها: '+Ee.length+'</p>';for(var i=L.length-1;i>=0&&i>L.length-9;i--)if(L[i])h+='<div style="font-size:12px">'+L[i].t+'</div>';h+='<button class="btn2" onclick="home()">بازگشت</button></div>';E('app').innerHTML=h}
function schoolStats(){if(!CU||!['builder','manager'].includes(CU.role))return home();sysReports()}
function secPage(){var L=G('log',[]).filter(function(l){return l.t.indexOf('login')>-1}),h='<div class="card"><h3>امنیت و نشست‌ها</h3>';for(var i=L.length-1;i>=0&&i>L.length-11;i--)if(L[i])h+='<div style="font-size:12px">'+L[i].t+'</div>';h+='<button onclick="backup()">پشتیبان‌گیری</button><input type="file" id="rf" accept=".json" onchange="restoreEv(event)"><button class="btn2" onclick="home()">بازگشت</button></div>';E('app').innerHTML=h}
function backup(){var d=storageSnapshot();if(!Object.keys(d).length){alert('داده‌ای برای پشتیبان‌گیری پیدا نشد.');return}var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vida-backup.json';a.click();setTimeout(function(){try{URL.revokeObjectURL(a.href)}catch(e){}},1500)}
function restoreEv(e){
 if(!CU||CU.role!=='builder'){alert('فقط مدیر سامانه می‌تواند پشتیبان را بازیابی کند.');return}
 var f=e&&e.target&&e.target.files&&e.target.files[0];if(!f)return;
 var r=new FileReader();r.onload=function(x){try{
  var d=JSON.parse(x.target.result);
  if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('bad backup');
  if(!confirm('اطلاعات فعلی با فایل پشتیبان جایگزین شود؟'))return;
  window.VIDADataAdapter.restore(d,P);
  alert('بازیابی انجام شد؛ صفحه را تازه‌سازی کنید.');
 }catch(err){alert('فایل پشتیبان نامعتبر است یا ساختار آن با VIDA سازگار نیست.')}};
 r.readAsText(f)
}

function errorsPage(){var Er=G('errors',[]),h='<div class="card"><h3>خطاها و گزارش مشکل</h3><input id="er" placeholder="شرح مشکل..."><button onclick="erAdd()">ثبت خطا</button>';for(var i=0;i<Er.length;i++)h+='<div class="card">'+Er[i]+'</div>';h+='<button class="btn2" onclick="home()">بازگشت</button></div>';E('app').innerHTML=h}
function erAdd(){var Er=G('errors',[]);Er.push(CU.name+': '+(E('er').value||'خطا'));S('errors',Er);errorsPage()}
function versionsPage(){var V=G('versions',[]),h='<div class="card"><h3>نسخه‌ها</h3>';for(var i=0;i<V.length;i++)h+='<div>'+V[i].t+'</div>';if(CU.role=='builder')h+='<input id="vs" placeholder="نسخه جدید"><button onclick="vsAdd()">افزودن نسخه</button>';h+='<button class="btn2" onclick="home()">بازگشت</button></div>';E('app').innerHTML=h}
function vsAdd(){var V=G('versions',[]);V.push({t:E('vs').value||'نسخه'});S('versions',V);versionsPage()}
function rulesPage(){var R=G('rulesText',''),can=CU.role=='builder',h='<div class="card"><h3>قوانین و حریم خصوصی</h3>';if(can)h+='<textarea id="ru">'+R+'</textarea><button onclick="ruSave()">ذخیره</button>';else h+='<p style="font-size:13px;line-height:2">'+R+'</p>';h+='<button class="btn2" onclick="home()">بازگشت</button></div>';E('app').innerHTML=h}
function ruSave(){S('rulesText',E('ru').value);alert('ذخیره شد');home()}
function privacyPage(){rulesPage()}
function settingsPage(){var St=G('settings',{site:'VIDA'}),isBuilder=!!(CU&&CU.role==='builder');E('app').innerHTML='<div class="card"><h3>تنظیمات اصلی VIDA</h3><label>نام برنامه</label><input id="stS" value="'+htmlSafe(St.site||'VIDA')+'" '+(isBuilder?'':'readonly disabled')+'><p style="font-size:12px;color:#aaa">'+(isBuilder?'فقط مدیر سامانه اجازه تغییر نام برنامه را دارد.':'نام برنامه توسط مدیر سامانه قفل شده است.')+'</p>'+(isBuilder?'<button onclick="stSave()">ذخیره نام</button>':'')+'<button class="btn2" onclick="home()">بازگشت</button></div>'}
function stSave(){if(!CU||CU.role!=='builder'){alert('فقط مدیر سامانه اجازه تغییر نام برنامه را دارد.');return settingsPage()}var n=(E('stS')&&E('stS').value||'').trim();if(!n||n.length>40){alert('نام باید بین ۱ تا ۴۰ نویسه باشد.');return}S('settings',Object.assign({},G('settings',{site:'VIDA'}),{site:n}));alert('نام برنامه ذخیره شد.');home()}
function settingsUser(){E('app').innerHTML='<div class="card"><h3>تنظیمات حساب</h3><button onclick="themeToggle()">تغییر روشن/تیره</button><button class="btn2" onclick="chPass()">تغییر رمز</button><button class="btn2" onclick="langPage()">زبان</button><button class="btn2" onclick="home()">بازگشت</button></div>'}
function langPage(){E('app').innerHTML='<div class="card"><h3>زبان</h3><div class="kv"><span>فارسی</span><span>فعال ✅</span></div><div class="kv"><span>English</span><span>به‌زودی</span></div><button class="btn2" onclick="home()">بازگشت</button></div>'}
function helpPage(){E('app').innerHTML='<div class="card"><h3>راهنمای استفاده</h3><p style="font-size:13px;line-height:2">برای شروع، از منوی اصلی بخش موردنظر را انتخاب کنید. مدیر مدرسه می‌تواند اطلاعات مدرسه، کاربران، کلاس‌ها و برنامه آموزشی را مدیریت کند. دبیران، دانش‌آموزان و والدین نیز از بخش‌های اختصاصی خود استفاده می‌کنند.</p><button class="btn2" onclick="home()">بازگشت</button></div>'}
function startTimerFromMeeting(m){var e=E('tm');if(!e)return;if(!m||Number(m.duration)===0){e.textContent='بدون محدودیت';window._timerRemain=0;return;}window._timerRemain=(Number(m.duration)||45)*60;window._timerPaused=true;paintTimer();}
boot();

window.addEventListener('error',function(ev){try{var msg=String(ev&&ev.message||'خطای ناشناخته در برنامه');var logs=G('errors',[]);logs.push({t:new Date().toISOString(),message:msg,line:ev&&ev.lineno||0});S('errors',logs.slice(-100));console.error('VIDA UI error:',msg)}catch(e){}});
window.addEventListener('unhandledrejection',function(ev){try{var reason=ev&&ev.reason,msg=String(reason&&reason.message||reason||'خطای ناهمگام');var logs=G('errors',[]);logs.push({t:new Date().toISOString(),message:msg});S('errors',logs.slice(-100));console.error('VIDA async error:',msg)}catch(e){}});



</script>
